unet:
  image_channels: 3
  output_channels: 3

  base_channels: 64
  channel_multipliers:
    - 1
    - 2
    - 4

  num_res_blocks: 2
  normalization_groups: 8
  dropout: 0.10

  time_embedding_dim: 256

  conditional: true
  context_dim: 128
  attention_levels:
    - 1
    - 2
  attention_heads: 4
