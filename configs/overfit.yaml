overfit:
  seed: 2026
  subset_size: 32
  batch_size: 32
  max_steps: 2000

  learning_rate:
    unet: 0.0002
    text_encoder: 0.0001

  weight_decay: 0.0001
  gradient_clip_norm: 1.0

  amp:
    enabled: true
    dtype: float16

  evaluation:
    seed: 3107
    every_steps: 100

  checkpoint:
    every_steps: 250
    cold_resume_step: 500
    directory: checkpoints/tiny_overfit

  logging:
    every_steps: 25
    history_path: outputs/tiny_overfit/history.csv
